[project]
name = "verdi-bridge"
version = "0.3.2"
description = "Let AI agents inspect waveforms and navigate RTL in a live Synopsys Verdi session"
authors = [{name = "Ruihong Yin"}]
keywords = ["mcp", "verdi", "rtl", "waveform", "eda", "asic", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Debuggers",
]
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]
license = "MIT"
readme = "README.md"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
verdi-bridge = "verdi_bridge.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
[tool.hatch.build.targets.wheel]
packages = ["src/verdi_bridge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Repository = "https://github.com/RuihongY/verdi_bridge"
Documentation = "https://github.com/RuihongY/verdi_bridge/blob/main/docs/guide.md"
Issues = "https://github.com/RuihongY/verdi_bridge/issues"
